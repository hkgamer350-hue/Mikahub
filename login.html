<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | MIKA HUB</title>

<link rel="stylesheet" href="style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#050816,#0b1833);
}

.login-box{
width:350px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,229,255,.3);
}

.login-box h2{
color:#00e5ff;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:14px;
margin:12px 0;
border:none;
border-radius:10px;
outline:none;
font-size:16px;
}

.login-box button{
width:100%;
padding:14px;
background:#00e5ff;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

.login-box button:hover{
box-shadow:0 0 20px #00e5ff;
}

.back{
display:block;
margin-top:20px;
color:#fff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Student Login</h2>

<form>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

</body>
</html>
