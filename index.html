<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mika Hub | SMC • ICT • Quotex</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#05070d;
color:#fff;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.6);
backdrop-filter:blur(12px);
z-index:999;
}

.logo{
font-size:32px;
font-weight:bold;
color:#00ff99;
}

nav a{
text-decoration:none;
color:#fff;
margin-left:25px;
font-size:18px;
transition:.3s;
}

nav a:hover{
color:#00ff99;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1642790106117-e829e14a795f?q=80&w=1600&auto=format&fit=crop") center/cover;
}

.hero h1{
font-size:55px;
color:#00ff99;
margin-bottom:20px;
}

.hero p{
font-size:22px;
max-width:700px;
color:#ddd;
margin-bottom:35px;
}

.btn{
display:inline-block;
padding:16px 38px;
background:#00ff99;
color:#000;
text-decoration:none;
font-weight:bold;
border-radius:10px;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 25px #00ff99;
}

.stats{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
padding:60px 20px;
background:#0b0f17;
}

.box{
width:220px;
background:#141b26;
padding:25px;
border-radius:15px;
text-align:center;
border:1px solid #1d2938;
}

.box h2{
color:#00ff99;
font-size:32px;
margin-bottom:10px;
}

.box p{
color:#bbb;
}

@media(max-width:768px){

.hero h1{
font-size:38px;
}

.hero p{
font-size:18px;
}

nav{
display:none;
}

.logo{
font-size:28px;
}

}
</style>

</head>

<body>

<header>

<div class="logo">Mika Hub</div>

<nav>
<a href="#">Home</a>
<a href="#">Courses</a>
<a href="#">Reviews</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h1>Master SMC • ICT • Quotex</h1>

<p>
Become a Professional Trader with Smart Money Concepts,
ICT Strategies and Quotex Masterclass.
</p>

<a href="#" class="btn">Start Learning</a>

</section>

<section class="stats">

<div class="box">
<h2>500+</h2>
<p>Students</p>
</div>

<div class="box">
<h2>15+</h2>
<p>Trading Lessons</p>
</div>

<div class="box">
<h2>24/7</h2>
<p>Support</p>
</div>

</section>

</body>
</html>
