<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment | Mika Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050816;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:350px;
height:350px;
background:#00e5ff;
filter:blur(170px);
top:-120px;
left:-120px;
opacity:.35;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:350px;
height:350px;
background:#7b2cff;
filter:blur(170px);
bottom:-120px;
right:-120px;
opacity:.35;
z-index:-1;
}

.payment-box{
width:100%;
max-width:430px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
box-shadow:0 0 30px rgba(0,229,255,.25);
animation:fade .8s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
font-size:30px;
margin-bottom:10px;
color:#00e5ff;
}

.subtitle{
text-align:center;
color:#bbb;
margin-bottom:25px;
}

.card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:20px;
margin-bottom:20px;
text-align:center;
}

.card h2{
color:#00e5ff;
margin-bottom:15px;
}

.qr{
width:220px;
height:220px;
object-fit:cover;
border-radius:18px;
border:3px solid #00e5ff;
box-shadow:0 0 20px #00e5ff;
margin-bottom:15px;
}
</style>
</head>

<body>

<div class="payment-box">

<h1>💳 Secure Payment</h1>

<p class="subtitle">
Pay using JazzCash or USDT and send the screenshot on WhatsApp.
</p>
